name: Check upstream

# Every 5 min: if upstream has a release we haven't built, dispatch build.yml.
# GitHub schedules are best effort: runs may be late or skipped. Successful runs
# are kept so the real cadence can be checked in the Actions tab.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch build if needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(gh release view -R stalwartlabs/stalwart --json tagName -q .tagName)
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "unexpected tag: $tag" >&2; exit 1; }
          version=${BASH_REMATCH[1]}

          if gh release view "v$version" -R "$REPO" >/dev/null 2>&1; then
            echo "v$version already built"; exit 0
          fi
          for s in queued in_progress; do
            if [ -n "$(gh run list -R "$REPO" -w build.yml -s "$s" --json databaseId -q '.[]')" ]; then
              echo "build already $s"; exit 0
            fi
          done

          echo "dispatching build for $version"
          gh workflow run build.yml -R "$REPO" -f version="$version"

